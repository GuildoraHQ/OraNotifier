// NeoForge server mod. Minecraft ${minecraft_version}; built with ModDevGradle.
plugins {
    id 'net.neoforged.moddev' version "${neoforge_moddev}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = neoforge
    mods { oranotifier { sourceSet(sourceSets.main) } }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', minecraft_version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version, minecraft_version: minecraft_version }
}
